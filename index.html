<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DOUBLE B — المنيو قيد التحديث</title>
<style>
  html,body{margin:0;height:100%}
  body{font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
       background:#f5efe7;color:#2b2320;display:flex;align-items:center;justify-content:center;text-align:center}
  .wrap{padding:32px}
  .logo{width:min(320px,60vw);margin:0 auto 24px;display:block}
  h1{font-size:clamp(20px,3.2vw,30px);margin:0 0 10px;font-weight:800;letter-spacing:.2px}
  p{font-size:clamp(14px,2.2vw,17px);margin:6px 0;color:#6b5f57}
  .dot{width:10px;height:10px;border-radius:50%;background:#c8a24a;display:inline-block;margin:0 6px;vertical-align:middle}
</style>
</head>
<body>
  <div class="wrap">
    <img class="logo" src="assets/logo-bb.png" alt="DOUBLE B">
    <h1>منيو قهوة اليوم <span class="dot"></span> قيد التحديث</h1>
    <p>نعمل حاليًا على تحديث صور المنيو بهوية موحّدة</p>
    <p>ونعود إليكم قريبًا بإذن الله — DOUBLE B Cafe</p>
  </div>
</body>
</html>
